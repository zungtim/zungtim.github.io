baseURL = "https://zungtim.github.io/"
languageCode = "zh-cn"
title = "我的个人主页"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[params]
  env = "production"
  title = "ZungTim's Portfolio"
  description = "一名热爱代码的 CS 学生"
  keywords = ["Blog", "Portfolio", "Computer Science"]
  author = "ZungTim"
  defaultTheme = "auto"
  
  # 首页配置
  [params.homeInfoParams]
    Title = "你好，我是 ZungTim 👋"
    Content = "欢迎来到我的数字花园 | 📍 ChemEng / CS / 科研 / 摄影"
  
  # 社交图标
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/zungtim"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:zungtimwong@gmail.com"

[menu]
  # 导航栏设计：点击直接跳转到 about 页面的对应板块
  [[menu.main]]
    identifier = "about"
    name = "👋 关于我"
    url = "/about/"
    weight = 10
  
  [[menu.main]]
    identifier = "education"
    name = "🎓 本科经历"
    url = "/about/#education" # 跳转到 #education 锚点
    weight = 20

  [[menu.main]]
    identifier = "research"
    name = "🔬 科研竞赛"
    url = "/about/#research" # 跳转到 #research 锚点
    weight = 30

  [[menu.main]]
    identifier = "travel"
    name = "✈️ 旅行足迹"
    url = "/about/#travel" # 跳转到 #travel 锚点
    weight = 40